# Job run by reid/platform.py on the HABS platform (process.py delegates to it),
# or locally with `habs run --data ./sample --out ./out`.
#
# job: features -> feature cache only, into out_dir/features (shardable, e.g.
#                  video: shard 0/4 ... 3/4 to stay under one hour per job)
# job: final    -> caches extracted into local scratch, then each group of
#                  models evaluated in its own process (groups run at once);
#                  run files in out_dir/runs, logs in out_dir/logs.
job: final
tasks: [rest]                    # rest, artefact, video
modalities: [eeg, ecg, resp]     # feature cache (LDA members); raw crops always
shard: 0/1                       # job: features only (i/n)
workers: 0                       # extraction processes, 0 = every CPU
deadline_min: 52                 # everything stops here (the platform kills at 60)
eval_task: rest
scenarios: [d1_to_d2]
# Parts: one job runs one part (at most ~52 min). The part is `part` below, or
# the one chosen when launching .github/workflows/reid_gpu.yml. Each part is a
# list of groups, one process per group, run at once on the same GPU.
part: all
parts:
  all:                           # the 3 seeds at once (6 processes)
    - [fuse_ref_lda3_s0, fuse_lda3_resp_s0, fuse_lda2_resp_s0]
    - [fuse_enc3_s0, fuse_enc3_eq_s0, fuse_all5_s0, fuse_all5_eq_s0]
    - [fuse_lda3_resp_s1, fuse_lda2_resp_s1]
    - [fuse_enc3_s1, fuse_enc3_eq_s1, fuse_all5_s1, fuse_all5_eq_s1]
    - [fuse_lda3_resp_s2, fuse_lda2_resp_s2]
    - [fuse_enc3_s2, fuse_enc3_eq_s2, fuse_all5_s2, fuse_all5_eq_s2]
  s0:
    - [fuse_ref_lda3_s0, fuse_lda3_resp_s0, fuse_lda2_resp_s0]
    - [fuse_enc3_s0, fuse_enc3_eq_s0, fuse_all5_s0, fuse_all5_eq_s0]
  s1:
    - [fuse_lda3_resp_s1, fuse_lda2_resp_s1]
    - [fuse_enc3_s1, fuse_enc3_eq_s1, fuse_all5_s1, fuse_all5_eq_s1]
  s2:
    - [fuse_lda3_resp_s2, fuse_lda2_resp_s2]
    - [fuse_enc3_s2, fuse_enc3_eq_s2, fuse_all5_s2, fuse_all5_eq_s2]
  pt_screen:                     # EEG pretraining on video EEG, 4 objectives vs none
    caches: [raw, video]         # (seed 0; choice on inner validation)
    groups:
      - [f_eeg_pool_refit_s0]
      - [f_eeg_pt_mae_s0]
      - [f_eeg_pt_jepa_s0]
      - [f_eeg_pt_session_s0]
      - [f_eeg_pt_xday_s0]
  joint:                         # joint model alone and fused with the 2 LDA
    groups:
      - [fuse_joint_s0, fuse_lda2_joint_s0, fuse_lda2_joint_eq_s0]
      - [fuse_joint_s1, fuse_lda2_joint_s1, fuse_lda2_joint_eq_s1]
      - [fuse_joint_s2, fuse_lda2_joint_s2, fuse_lda2_joint_eq_s2]
  pt_screen2a:                   # fine-tuning at lr 3e-4; jepa completed
    caches: [raw, video]
    groups:
      - [f_eeg_lr3_s0]
      - [f_eeg_pt_mae_lr3_s0]
      - [f_eeg_pt_jepa_s0]
  pt_screen2b:
    caches: [raw, video]
    groups:
      - [f_eeg_pt_jepa_lr3_s0]
      - [f_eeg_pt_session_lr3_s0]
  joint2:                        # joint variants vs separate encoders (seed 0)
    groups:
      - [fuse_enc3_s0, fuse_enc3_eq_s0]
      - [j_all3_bw1_s0]
      - [j_all3_bw4_s0]
  pt_long:                       # mae pretraining 20000 steps, 5 folds in parallel
    caches: [raw, video]
    groups:
      - [pretrain, f_eeg_pt_maelong_s0, 0]
      - [pretrain, f_eeg_pt_maelong_s0, 1]
      - [pretrain, f_eeg_pt_maelong_s0, 2]
      - [pretrain, f_eeg_pt_maelong_s0, 3]
      - [pretrain, f_eeg_pt_maelong_s0, 4]
      - [f_eeg_pt_maelong_lr3_s0]
      - [f_eeg_pt_maelong_s0]
  pt_fuse:                       # fuse_all5 with the mae-pretrained EEG encoder,
    caches: [features, raw, video]  # 3 seeds, vs fuse_all5 (now with fold_configs)
    groups:
      - [pretrain, f_eeg_pt_mae_s0, 0]
      - [pretrain, f_eeg_pt_mae_s0, 1]
      - [pretrain, f_eeg_pt_mae_s0, 2]
      - [pretrain, f_eeg_pt_mae_s0, 3]
      - [pretrain, f_eeg_pt_mae_s0, 4]
      - [fuse_all5_s0, fuse_all5_eq_s0]
      - [fuse_all5_pt_s0, fuse_all5_pt_eq_s0]
      - [fuse_all5_s1, fuse_all5_eq_s1]
      - [fuse_all5_pt_s1, fuse_all5_pt_eq_s1]
      - [fuse_all5_s2, fuse_all5_eq_s2]
      - [fuse_all5_pt_s2, fuse_all5_pt_eq_s2]
  ecg_p043:                      # whole-rest ECG (scripts/ecg_rest_full.py), no model;
    job: ecg_rest                # outputs in out_dir/ecg_rest, kept out of the
    participants: [P043]         # GitHub artifact (public repo)
    days: [1, 2]
  ecg_tk_rest:                   # Tanasković et al. 2025 ECG features, every rest
    job: ecg_tanaskovic          # recording of days 1-2; per-participant output in
    days: [1, 2]                 # out_dir/private (kept out of the GitHub artifact)
